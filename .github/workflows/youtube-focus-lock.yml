name: YouTube Focus Lock v2 CI

on:
  push:
    branches: [youtube-focus-lock, youtube-focus-lock-v2]
    paths:
      - "youtube-focus-lock/**"
      - ".github/workflows/youtube-focus-lock.yml"
  pull_request:
    paths:
      - "youtube-focus-lock/**"
      - ".github/workflows/youtube-focus-lock.yml"

jobs:
  validate:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: youtube-focus-lock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JS test dependencies
        run: npm install
      - name: Node unit tests
        run: npm test
      - name: Problem-bank integrity
        run: python3 macos/problem_bank.py
      - name: Challenge gate self-test
        run: python3 macos/challenge_gate.py self-test
      - name: Challenge UI self-test
        run: python3 macos/challenge_ui.py self-test
      - name: Challenge integration tests
        run: cd macos && python3 -m unittest -v test_challenge_system.py
      - name: Source/provenance checks
        run: python3 tests/prearm_source_check.py
      - name: Compile Python components
        run: python3 -m py_compile macos/problem_bank.py macos/challenge_gate.py macos/challenge_ui.py macos/test_challenge_system.py tests/prearm_source_check.py
      - name: Validate JavaScript
        run: |
          node --check macos/challenge_ui.js
          node --check src/status.js
          node --check tests/e2e/judge-ui.spec.mjs
          node --check tests/e2e/brave-popup.spec.mjs
      - name: Shell syntax
        run: bash -n macos/*.sh tests/macos/*.sh
      - name: Validate manifest JSON
        run: python3 -m json.tool manifest.json >/dev/null
      - name: Package exact tested commit
        run: cd .. && /usr/bin/zip -qr "YouTube-Focus-Lock-${GITHUB_SHA}.zip" youtube-focus-lock -x 'youtube-focus-lock/node_modules/*' 'youtube-focus-lock/test-results/*' 'youtube-focus-lock/playwright-report/*'
      - name: Upload exact tested build
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Focus-Lock-${{ github.sha }}
          path: YouTube-Focus-Lock-${{ github.sha }}.zip
          if-no-files-found: error
