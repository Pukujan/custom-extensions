name: YouTube Focus Lock Cross-Platform CI

on:
  push:
    branches: [youtube-focus-lock, youtube-focus-lock-v2]
    paths:
      - "youtube-focus-lock/**"
      - ".github/workflows/youtube-focus-lock.yml"
  pull_request:
    paths:
      - "youtube-focus-lock/**"
      - ".github/workflows/youtube-focus-lock.yml"

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: youtube-focus-lock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JS test dependencies
        run: npm install
      - name: Extension unit tests
        run: npm test
      - name: 120-problem bank integrity
        run: python runtime/problem_bank.py
      - name: Shared challenge gate self-test
        run: python runtime/challenge_gate.py self-test
      - name: Shared challenge UI self-test
        run: python runtime/challenge_ui.py self-test
      - name: Shared persistence/integration tests
        run: python runtime/test_challenge_system.py -v
      - name: Source/provenance checks
        run: python tests/prearm_source_check.py
      - name: Compile Python components
        run: python -m py_compile runtime/problem_bank.py runtime/challenge_gate.py runtime/challenge_ui.py runtime/test_challenge_system.py tests/prearm_source_check.py
      - name: Validate JavaScript
        run: |
          node --check runtime/challenge_ui.js
          node --check src/status.js
          node --check tests/e2e/start-judge.mjs
          node --check tests/e2e/judge-ui.spec.mjs
          node --check tests/e2e/brave-popup.spec.mjs
      - name: Validate manifest JSON
        run: python -m json.tool manifest.json
      - name: macOS shell syntax
        if: runner.os == 'macOS'
        shell: bash
        run: bash -n macos/*.sh tests/macos/*.sh
      - name: Windows PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem windows/*.ps1,tests/windows/*.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content $_.FullName -Raw))
          }

  package:
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact cross-platform tested commit
        shell: bash
        run: git archive --format=zip --prefix=youtube-focus-lock/ -o "YouTube-Focus-Lock-${GITHUB_SHA}.zip" "${GITHUB_SHA}:youtube-focus-lock"
      - name: Upload exact tested build
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Focus-Lock-${{ github.sha }}
          path: YouTube-Focus-Lock-${{ github.sha }}.zip
          if-no-files-found: error
