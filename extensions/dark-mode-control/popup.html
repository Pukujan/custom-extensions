<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dark Mode Control</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="moon" aria-hidden="true">☾</span><div><h1>Dark Mode Control</h1><p>A calmer view of the web.</p></div></header>
  <label class="switch-row">Dark mode on all websites<input id="master" type="checkbox" role="switch" disabled></label>
  <section aria-labelledby="site-heading">
    <h2 id="site-heading">This website</h2><p id="hostname">Loading…</p>
    <label class="switch-row">Enable on this site<input id="enabled" type="checkbox" role="switch" disabled></label>
    <fieldset id="adjustments" disabled>
      <div class="range"><label for="contrast">Contrast</label><output id="contrast-value" for="contrast">100%</output><input id="contrast" type="range" min="50" max="150" value="100"></div>
      <div class="range"><label for="brightness">Brightness</label><output id="brightness-value" for="brightness">100%</output><input id="brightness" type="range" min="50" max="150" value="100"></div>
      <div class="range"><label for="sepia">Warmth</label><output id="sepia-value" for="sepia">0%</output><input id="sepia" type="range" min="0" max="100" value="0"></div>
    </fieldset>
    <button id="reset" type="button" disabled>Reset this site</button>
  </section>
  <p id="status" role="status" aria-live="polite">Reading settings…</p>
  <footer>Saved on this device · No tracking</footer>
  <script src="core.js"></script><script src="popup.js"></script>
</body></html>
