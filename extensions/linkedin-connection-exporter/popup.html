<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Connection List Exporter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>Connection List Exporter</h1>
    <p class="hint">Open the LinkedIn connection-list page first.</p>

    <div class="grid">
      <label>Max pages
        <input id="maxPages" type="number" min="1" max="999" value="99">
      </label>
      <label>Delay (ms)
        <input id="delayMs" type="number" min="800" max="60000" step="100" value="2500">
      </label>
    </div>

    <div class="buttons">
      <button id="validate">Validate Current Page</button>
      <button id="start" class="primary">Start / Resume</button>
      <button id="stop">Stop</button>
    </div>

    <section class="status">
      <div><strong>Rows:</strong> <span id="count">0</span></div>
      <div><strong>Page:</strong> <span id="page">0</span></div>
      <div id="statusText">Idle</div>
    </section>

    <div class="buttons">
      <button id="csv">Export CSV</button>
      <button id="tsv">Export TSV</button>
      <button id="clear" class="danger">Clear</button>
    </div>

    <p class="foot">Exports every collected connection: name, degree, headline, location, mutuals, details, profile URL, page/order, and raw visible row text.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
